[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon on iPhone and iPad: the game with the iOS app's folders and only the parts that send nothing"

[[bin]]
name = "Horizon"
path = "src/main.rs"
test = false

[dependencies]
horizon-game = { path = "../horizon-game", default-features = false, features = ["audio", "horizon-extras"] }
horizon-platform = { path = "../horizon-platform" }
horizon-addresses = { path = "../horizon-addresses" }
horizon-official-servers = { path = "../horizon-official-servers" }
log = "0.4"

[lints]
workspace = true
