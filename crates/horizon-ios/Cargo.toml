[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon on iPhone and iPad: the game with the iOS app's folders and only the parts that send nothing"

[[bin]]
name = "Horizon"
path = "src/main.rs"
test = false

[dependencies]
horizon-game = { path = "../horizon-game", default-features = false, features = ["audio", "horizon-extras"] }
horizon-platform = { path = "../horizon-platform" }
horizon-addresses = { path = "../horizon-addresses" }
horizon-official-servers = { path = "../horizon-official-servers" }
log = "0.4"
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
# The audio session (AVAudioSession), through the Objective-C runtime.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[lints]
workspace = true
