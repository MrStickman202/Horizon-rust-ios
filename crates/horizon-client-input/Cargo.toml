[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
horizon-engine-slots = { path = "../horizon-engine-slots" }
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
log = "0.4"
png = "0.18"

# The system clipboard: arboard, and on iOS (which arboard doesn't support) UIPasteboard.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSURL"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

[features]
controllers = []

[lints]
workspace = true
